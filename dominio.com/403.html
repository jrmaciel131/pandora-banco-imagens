<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>403 — Acesso negado · Banco de Imagens</title>
<style>
:root{
  --bg:#f0f0ee;--sf:#ffffff;--bd:rgba(0,0,0,.08);--bds:rgba(0,0,0,.16);
  --tx:#111110;--tx2:#52524e;--tx3:#8a8a84;
  --rbg:#fee2e2;--rtx:#991b1b;
  --r:12px;--rs:8px;--accent:#2563eb;
  --shadow-lg:0 12px 32px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f0f11;--sf:#1a1a1d;--bd:rgba(255,255,255,.1);--bds:rgba(255,255,255,.22);
  --tx:#f0f0ec;--tx2:#b8b8b2;--tx3:#787872;
  --rbg:#3f0a0a;--rtx:#fca5a5;
  --accent:#3b82f6;
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:2.5rem 2.25rem;width:100%;max-width:440px;box-shadow:var(--shadow-lg);text-align:center}
.code{font-size:64px;font-weight:700;line-height:1;color:var(--tx);letter-spacing:-2px;margin-bottom:.4rem}
.code .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rtx);margin:0 8px 14px;vertical-align:middle}
h1{font-size:18px;font-weight:600;margin-bottom:.5rem;color:var(--tx)}
p{color:var(--tx2);font-size:14px;margin-bottom:1.5rem}
.timer{display:inline-flex;align-items:center;gap:.5rem;background:var(--bd);border-radius:var(--rs);padding:.55rem 1rem;font-size:13px;color:var(--tx2);margin-bottom:1.25rem}
.timer strong{color:var(--tx);font-variant-numeric:tabular-nums;min-width:1ch}
.actions{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;border:0.5px solid var(--bds);transition:opacity .15s,transform .1s,background .15s}
.btn:active{transform:scale(.98)}
.bp{background:var(--tx);color:var(--bg);border-color:var(--tx)}.bp:hover{opacity:.85}
.bs{background:transparent;color:var(--tx2)}.bs:hover{background:var(--bd)}
.bar{height:3px;background:var(--bd);border-radius:99px;overflow:hidden;margin-top:1rem}
.bar-fill{height:100%;background:var(--accent);width:100%;animation:shrink 5s linear forwards;transform-origin:left}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.bar-fill{animation:none}}
</style>
</head>
<body>
<main class="card" role="alert" aria-live="polite">
  <div class="code">4<span class="dot"></span>3</div>
  <h1>Acesso negado</h1>
  <p>Você não tem permissão para acessar este recurso.</p>
  <div class="timer">Redirecionando em <strong id="cd">5</strong>s</div>
  <div class="actions">
    <a href="/" class="btn bp">Voltar agora</a>
    <a href="javascript:history.back()" class="btn bs">Página anterior</a>
  </div>
  <div class="bar"><div class="bar-fill"></div></div>
</main>
<script>
(function(){
  var n=5,el=document.getElementById('cd');
  var t=setInterval(function(){
    n--;
    if(el)el.textContent=n;
    if(n<=0){clearInterval(t);location.replace('/');}
  },1000);
})();
</script>
</body>
</html>
